name: SuperdotsWatch
options:
  bundleIdPrefix: com.superdotspals
  deploymentTarget:
    watchOS: "10.0"
targets:
  SuperdotsWatch:
    type: application
    platform: watchOS
    sources:
      - path: SuperdotsWatch
    dependencies:
      - sdk: HealthKit.framework
      - sdk: WidgetKit.framework
      - sdk: WatchConnectivity.framework
    entitlements:
      path: SuperdotsWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superdotspals.watch
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_CFBundleDisplayName: MoodPals
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_NSHealthShareUsageDescription: MoodPals reads heart rate, heart rate variability and resting heart rate on your watch to estimate your stress level compared with your own baseline.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: MoodPals starts a short mind & body session during Measure now to read your heart rate. The session is not saved as a workout.
        INFOPLIST_KEY_WKBackgroundModes: workout-processing
